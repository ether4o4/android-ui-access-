name: Build ODCM APK

on:
  push:
    branches: [claude/android-messaging-bridge-9vsv90, main]
  pull_request:
    branches: [claude/android-messaging-bridge-9vsv90, main, codex/obsidian-vault-reference, codex/companion-provider-phone-update]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Android signing key
        id: signing
        if: github.ref_name == 'main'
        env:
          ODCM_DEBUG_KEYSTORE_BASE64: ${{ secrets.ODCM_DEBUG_KEYSTORE_BASE64 }}
        run: bash tools/restore-signing.sh

      - name: Prepare bundled offline voice
        run: python3 tools/prepare-bundled-voice.py

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Only the main release job receives the long-lived signing key. PRs remain test builds.
      - name: Unit tests, lint, and debug APK
        run: |
          set -e
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:lintPreview :app:assemblePreview :app:lintLocalPreview :app:assembleLocalPreview; then
              exit 0
            fi
            echo "Gradle attempt $attempt failed (often a transient Maven 429); retrying…"
            sleep $((attempt * 25))
          done
          echo "All attempts failed."
          exit 1

      - name: Enable KVM for offline voice verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify bundled voice on Android without network
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ODCM-debug.apk
          cp app/build/outputs/apk/preview/app-preview.apk ODCM-preview.apk
          cp app/build/outputs/apk/localPreview/app-localPreview.apk ODCM-local-preview.apk

      - name: Verify final APK signing certificate
        if: github.ref_name == 'main'
        run: |
          set -euo pipefail
          expected=$(tr -d '[:space:]' < signing/certificate.sha256)
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs ODCM-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$actual" = "$expected"

      - name: Upload APK artifact
        if: github.ref_name != 'main' || steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ODCM-apks
          path: |
            ODCM-debug.apk
            ODCM-preview.apk
            ODCM-local-preview.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish rolling pre-release
        if: steps.signing.outputs.ready == 'true' && github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ODCM latest build
          prerelease: true
          files: ODCM-debug.apk
          body: |
            Rolling build of ODCM, signed with the persistent repository key. Sideload on Android.
            Built from main after unit tests, lint, and APK assembly pass.
            Commit: ${{ github.sha }}
            Download: https://github.com/ether4o4/android-ui-access-/releases/download/android-latest/ODCM-debug.apk

      - name: Remove signing material
        if: always() && github.ref_name == 'main'
        run: rm -f "$HOME/.android/debug.keystore"
