name: Publish tested ODCM 0.3.5

# One-version exception: the owner explicitly accepted reinstalling for this release.
# Future builds still require persistent signing in build.yml.
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-035.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify the tested source and download its exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/44055706605" > run.json
          python3 - <<'PY'
          import json
          r = json.load(open('run.json'))
          assert r['conclusion'] == 'success' and r['status'] == 'completed'
          assert r['head_sha'] == '8db5bdf38d89d3879cb9869a1616cb490693f713'
          assert r['head_repository']['full_name'] == 'ether4o4/android-ui-access-'
          PY
          gh api "repos/$GH_REPO/actions/artifacts/14316006690/zip" > tested-apks.zip
          echo '9efe0af4b815967d4ce474590b20c64efceed9eb261f79f8d28be5e36e866e33  tested-apks.zip' | sha256sum --check
          unzip -p tested-apks.zip ODCM-debug.apk > ODCM-debug.apk
          test -s ODCM-debug.apk
          sha256sum ODCM-debug.apk

      - name: Publish the approved reinstall build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ODCM 0.3.5 — hands-free voice
          prerelease: true
          files: ODCM-debug.apk
          body: |
            ODCM 0.3.5 (build 14): tap the microphone once for automatic send, spoken replies, and continued listening. No recording popup. Includes the readable reasoning-effort selector.

            This release uses the tested CI debug signature. The owner explicitly accepted uninstall/reinstall for this version; installing it may require uninstalling the previous ODCM and re-entering settings and API keys. Persistent signing is not yet configured for future updates.

            Source merged to main: 8a8305a1e259c1fe19417beb3ec058642bff5583
            Exact tested head: 8db5bdf38d89d3879cb9869a1616cb490693f713
            Validation: 168 unit tests, all three lint checks and APK builds passed in run 44055706605. Real Samsung/Next-gen Kaldi playback still needs device verification.

            Download: https://github.com/ether4o4/android-ui-access-/releases/download/android-latest/ODCM-debug.apk
