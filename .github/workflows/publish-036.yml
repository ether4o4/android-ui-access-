name: Publish tested ODCM 0.3.6

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-036.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested source and download exact APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = 'ether4o4/android-ui-access-'
          gh api "repos/$GH_REPO/actions/runs/44227000940" > run.json
          gh api "repos/$GH_REPO/pulls/8" > pr.json
          python3 - <<'PY'
          import json
          r=json.load(open('run.json')); p=json.load(open('pr.json'))
          expected='c14f031239a00cffd33a99db55a24b20c6f921f5'
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_sha']==expected and p['head']['sha']==expected and p['merged']
          PY
          gh api "repos/$GH_REPO/actions/artifacts/14393641889/zip" > tested-apks.zip
          echo '5acd63beb0695176d4ee62f2535d411e9de621ccb875edab142103e0a58a252f  tested-apks.zip' | sha256sum -c -
          unzip -q tested-apks.zip ODCM-debug.apk
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          with zipfile.ZipFile('ODCM-debug.apk') as z:
              expected={
                  'model.onnx':'b40f62b166ac8164b0627ef48a0b358eda0985e272fb03ef5252e7206305da11',
                  'voices.bin':'1c5a5b983d3d50d8586d437a51f3faa2da7919ce76a013c081e65671a3447c29',
                  'tokens.txt':'6ebb6bb288f20f3ae8d004d3c2ca27697da27c037d75e81a60e2a6a663f95425',
                  'lexicon-us-en.txt':'7daaab53a181be9885b853a8582bf1838186317e5dadacbcef9c426d6fa0da14',
              }
              for name,digest in expected.items():
                  assert hashlib.sha256(z.read('assets/kokoro/'+name)).hexdigest()==digest, name
              for abi in ['arm64-v8a','x86_64']:
                  for name in ['libsherpa-onnx-jni.so','libonnxruntime.so']:
                      assert z.getinfo('lib/'+abi+'/'+name).file_size>1000000
              assert z.getinfo('assets/kokoro/espeak-ng-data/phondata').file_size>0
              assert z.getinfo('assets/voice-licenses/ESPEAK-GPL-3.0.txt').file_size>0
          print('Verified APK bytes:',Path('ODCM-debug.apk').stat().st_size)
          PY
      - name: Package corresponding voice source
        run: |
          python3 tools/package-voice-sources.py
          sha256sum ODCM-debug.apk ODCM-0.3.6-voice-source.tar.gz > SHA256SUMS-0.3.6.txt
      - name: Publish tested offline voice build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ODCM 0.3.6 — built-in Michael voice
          prerelease: true
          files: |
            ODCM-debug.apk
            ODCM-0.3.6-voice-source.tar.gz
            SHA256SUMS-0.3.6.txt
          body: |
            ODCM 0.3.6 includes the offline Kokoro Michael male voice and speech engine inside the APK. No separate TTS app, voice endpoint or runtime model download is required.

            Settings → Test voice works in airplane mode. Android's installed offline voice remains optional. Speech recognition still uses Android's on-device recognizer where supported; its fallback and the cloud agent may need internet.

            Hands-free turn taking remains: tap the companion mic once, speak, and pause to send. ODCM waits for replies to finish playing before listening again. Failed phone actions now show their actual reason in the log. Screen learning is explicitly passive.

            Validated: 173 unit tests; lint and assembly for debug/preview/localPreview; native speech generation and playback on Android 15 with Wi-Fi and mobile data disabled. Real-phone microphone quality and Gmail task reliability are not verified by this build.

            This is the exact APK from successful CI run 44227000940, tested source c14f031239a00cffd33a99db55a24b20c6f921f5. It uses that runner's debug certificate. Installations signed by another certificate require uninstall/reinstall, which removes local settings and keys. A stable repository signing secret remains necessary for future in-place updates.

            The bundled model increases APK size substantially. Corresponding voice/runtime source and SHA-256 checksums are attached. Individual component licenses and notices are included in the APK and source.
